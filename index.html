<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ec" />
    <meta name="description" content="屏幕与声音，分享给朋友。" />
    <title>Piik · 一起看</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <a class="brand" href="/" data-i18n-label="home" aria-label="Piik 首页">
          <img
            class="brand-mark"
            src="/logo.svg"
            alt=""
            width="42"
            height="42"
          />
          <span>Piik</span>
        </a>
        <div class="header-actions">
          <span class="privacy"
            ><span class="dot"></span
            ><span data-i18n="privacy">仅限邀请</span></span
          >
          <button
            id="language"
            class="language-switch"
            type="button"
            aria-label="切换为英文"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
            >
              <circle cx="10" cy="10" r="7.2" />
              <ellipse cx="10" cy="10" rx="3.2" ry="7.2" />
              <path d="M3 10h14" />
            </svg>
            <span id="language-label">中文</span>
          </button>
        </div>
      </header>
      <main>
        <section id="lobby" class="lobby" aria-labelledby="lobby-title">
          <div class="intro">
            <h1 id="lobby-title" data-i18n="headline">好东西，&#10;一起看。</h1>
            <p data-i18n="intro">屏幕与声音，分享给朋友。</p>
            <div class="details">
              <span data-i18n="noInstall">无需安装</span
              ><span data-i18n="capacity">最多 20 位朋友</span>
            </div>
          </div>
          <div class="entry-card">
            <div class="sofa" aria-hidden="true">
              <span class="sofa-back"></span><span class="sofa-seat"></span
              ><span class="sofa-arm left"></span
              ><span class="sofa-arm right"></span
              ><span class="sofa-leg left"></span
              ><span class="sofa-leg right"></span><span class="cushion"></span>
            </div>
            <h2 id="entry-title">留个座位。</h2>
            <form id="entry-form">
              <label for="name" data-i18n="name">你的名字</label>
              <input
                id="name"
                name="name"
                required
                maxlength="32"
                autocomplete="nickname"
                placeholder="怎么称呼你？"
              />
              <button id="enter" class="button primary" type="submit">
                创建房间 ↗
              </button>
            </form>
            <p class="small" id="entry-note">建房后，复制邀请给朋友。</p>
          </div>
        </section>
        <section id="room" class="room" hidden aria-labelledby="room-title">
          <div class="room-heading">
            <div>
              <span id="role-label" class="eyebrow">房主</span>
              <h1 id="room-title" data-i18n="roomTitle">一起看。</h1>
            </div>
            <button
              id="copy-invite"
              class="button secondary"
              data-i18n="copyInvite"
              hidden
            >
              复制邀请 ↗
            </button>
          </div>
          <div class="room-layout">
            <div class="screen-column">
              <div class="screen">
                <div id="waiting" class="waiting">
                  <span class="screen-symbol" aria-hidden="true">↗</span>
                  <h2 id="waiting-title">准备好就开始。</h2>
                  <p id="waiting-description">选择屏幕、窗口或标签页。</p>
                </div>
                <video id="video" playsinline autoplay hidden></video>
                <button
                  id="play"
                  class="button play-button"
                  data-i18n="play"
                  hidden
                >
                  播放声音
                </button>
                <span
                  id="video-label"
                  class="video-label"
                  data-i18n="preview"
                  hidden
                  >本地预览 · 静音</span
                >
              </div>
              <div class="toolbar">
                <div class="connection">
                  <span id="connection-dot" class="dot"></span
                  ><span id="connection-text">已连接</span>
                </div>
                <div class="actions">
                  <button
                    id="share"
                    class="button primary"
                    data-i18n="share"
                    hidden
                  >
                    共享屏幕
                  </button>
                  <button
                    id="stop"
                    class="button secondary"
                    data-i18n="stop"
                    hidden
                  >
                    停止共享
                  </button>
                  <button
                    id="reconnect"
                    class="button ghost"
                    data-i18n="reconnect"
                  >
                    重新连接
                  </button>
                </div>
              </div>
              <p id="audio-note" class="small audio-note"></p>
            </div>
            <aside class="people-panel">
              <div class="panel-heading">
                <h2 data-i18n="friends">朋友</h2>
                <span id="count" class="count">0 / 20</span>
              </div>
              <ul id="members" class="members"></ul>
              <div class="room-foot">
                <span data-i18n="privateRoom">私密房间</span
                ><button id="leave" class="text-button">离开房间</button>
              </div>
            </aside>
          </div>
        </section>
        <div id="status" class="status" role="status" aria-live="polite" hidden>
          <span id="status-message"></span>
        </div>
        <p
          id="configuration"
          class="configuration"
          data-i18n="unavailable"
          hidden
        >
          服务暂不可用，请稍后再试。
        </p>
      </main>
      <footer class="footer">
        <span data-i18n="footer">一起看，更有趣。</span><span>Piik</span>
      </footer>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
