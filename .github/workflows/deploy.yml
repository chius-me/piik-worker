name: Check and deploy Piik

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish any active deployment before publishing the next revision.
concurrency:
  group: piik-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types, run tests and build
        run: npm run check

      - name: Validate deployment
        run: npx cf deploy --prebuilt --mode production --dry-run

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this repository's Actions secrets."
            exit 1
          fi
          npx cf deploy --prebuilt --mode production --message "GitHub Actions: ${GITHUB_SHA}"

      - name: Verify public deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/check-deployment.mjs
